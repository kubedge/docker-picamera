[package]
name = "picamera-rs"
version = "0.1.0"
edition = "2024"
description = "Memory-lean Rust implementation of the docker-picamera MJPEG stream (camera-streaming contract)."
license = "Apache-2.0"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["rt", "macros", "net", "process", "io-util", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "ansi", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
