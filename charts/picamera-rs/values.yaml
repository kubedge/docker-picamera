image:
  repository: kubedge1/picamera-rs
  # Empty means the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

auth:
  # REQUIRED. Name of an existing Secret with keys `username` and `password`:
  #   kubectl create secret generic picamera-auth \
  #     --from-literal=username=pi --from-literal=password=<password>
  # No credential is ever set in values.
  existingSecret: ""

camera:
  resolution: 800x600
  framerate: 24
  # 0 or 180 only.
  rotate: 0
  hflip: false
  vflip: false

nameOverride: ""
fullnameOverride: ""

# Camera nodes: label each with `kubectl label node <node> picameraInstalled=true`.
nodeSelector:
  kubernetes.io/arch: arm64
  picameraInstalled: "true"

service:
  type: NodePort
  port: 9090
  nodePort: 30456

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - /
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# kubedge-dashboard discovery: label kubedge.device.name=camera on the pod, annotation
# kubedge.io/stream-url (in-cluster), and kubedge.io/external-url when externalUrl is set.
# The browser still does the Basic-auth prompt; nothing here carries a credential.
dashboard:
  discoverable: true
  # Browser-reachable stream URL, e.g. http://<node>:30456/stream.mjpg. Empty: no link.
  externalUrl: ""

# Sized for the Rust image (picamera-rs + rpicam-vid in one cgroup). Measured on a Pi 3
# (kube-node02, 2026-10-09): memory.peak 6.8-9.5 MiB; limit = highest peak x 1.5, rounded up.
resources:
  requests:
    memory: 10Mi
  limits:
    memory: 16Mi
